<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIE AS-Level Science Grade Calculator (June 2025)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom scrollbars and transition styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-teal-500 selection:text-slate-950">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- IMMUTABLE NATIVE SVG ICONS (Fixed class -> className to prevent React crashes) ---
    const Icons = {
      Calculator: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="16"></line><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="22" x2="16" y2="16"></line><line x1="9" y1="16" x2="16" y2="16"></line><line x1="9" y1="12" x2="16" y2="12"></line><line x1="9" y1="16" x2="9" y2="12"></line><line x1="16" y1="16" x2="16" y2="12"></line></svg>
      ),
      Award: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
      ),
      Sliders: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="2" y1="14" x2="6" y2="14"></line><line x1="10" y1="8" x2="14" y2="8"></line><line x1="18" y1="16" x2="22" y2="16"></line></svg>
      ),
      BookOpen: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
      ),
      RotateCcw: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2.5 2v6h6"></path><path d="M2.66 15.57a10 10 0 1 0-.57-8.38l5.67-5.67"></path></svg>
      ),
      Copy: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      ),
      Check: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      ),
      Info: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      ),
      TrendingUp: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
      ),
      Sparkles: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 5a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7z"></path></svg>
      ),
      HelpCircle: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      ),
      ExternalLink: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      ),
      Bookmark: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      ),
      AlertCircle: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      )
    };

    // --- OFFICIAL GRADED BOUNDARIES & THRESHOLDS (June 2025 Syllabus) ---
    const OFFICIAL_THRESHOLDS = {
      physics: {
        S1: { name: "Variant 11, 21, 31 (Option S1)", A: 94, B: 85, C: 73, D: 62, E: 51 },
        S2: { name: "Variant 11, 21, 32 (Option S2)", A: 94, B: 83, C: 72, D: 61, E: 50 },
        S3: { name: "Variant 12, 22, 33 (Option S3)", A: 97, B: 85, C: 72, D: 59, E: 46 },
        S4: { name: "Variant 12, 22, 34 (Option S4)", A: 96, B: 83, C: 70, D: 57, E: 45 },
        S5: { name: "Variant 13, 23, 35 (Option S5)", A: 95, B: 83, C: 70, D: 58, E: 46 },
        SA: { name: "Variant 14, 24, 37 (Option SA)", A: 92, B: 79, C: 67, D: 55, E: 44 },
        SB: { name: "Variant 14, 24, 38 (Option SB)", A: 91, B: 77, C: 65, D: 54, E: 43 }
      },
      biology: {
        S1: { name: "Variant 11, 21, 31 (Option S1)", A: 90, B: 80, C: 69, D: 59, E: 49 },
        S2: { name: "Variant 11, 21, 32 (Option S2)", A: 90, B: 81, C: 70, D: 60, E: 50 },
        S3: { name: "Variant 12, 22, 33 (Option S3)", A: 85, B: 73, C: 63, D: 53, E: 43 },
        S4: { name: "Variant 12, 22, 34 (Option S4)", A: 86, B: 75, C: 65, D: 55, E: 45 },
        S5: { name: "Variant 13, 23, 35 (Option S5)", A: 94, B: 84, C: 74, D: 65, E: 56 },
        S7: { name: "Variant 14, 24, 37 (Option S7)", A: 89, B: 76, C: 66, D: 56, E: 46 },
        S8: { name: "Variant 14, 24, 38 (Option S8)", A: 90, B: 78, C: 68, D: 58, E: 48 }
      },
      chemistry: {
        S1: { name: "Variant 11, 21, 31 (Option S1)", A: 92, B: 78, C: 64, D: 51, E: 38 },
        S2: { name: "Variant 11, 21, 32 (Option S2)", A: 91, B: 77, C: 63, D: 50, E: 37 },
        S3: { name: "Variant 12, 22, 33 (Option S3)", A: 94, B: 80, C: 66, D: 52, E: 38 },
        S4: { name: "Variant 12, 22, 34 (Option S4)", A: 93, B: 79, C: 65, D: 51, E: 37 },
        S5: { name: "Variant 13, 23, 35 (Option S5)", A: 93, B: 79, C: 65, D: 52, E: 39 },
        S7: { name: "Variant 14, 24, 37 (Option S7)", A: 89, B: 75, C: 61, D: 48, E: 35 },
        S8: { name: "Variant 14, 24, 38 (Option S8)", A: 88, B: 74, C: 60, D: 47, E: 34 }
      }
    };

    function App() {
      // General App State
      const [activeTab, setActiveTab] = useState('dashboard');
      const [studentName, setStudentName] = useState('');
      const [copied, setCopied] = useState(false);

      // Selected active thresholds for each subject
      const [selectedVariants, setSelectedVariants] = useState({
        physics: 'S1',
        chemistry: 'S1',
        biology: 'S1'
      });

      // Custom/Editable thresholds buffer
      const [customThresholds, setCustomThresholds] = useState({
        physics: { ...OFFICIAL_THRESHOLDS.physics.S1 },
        chemistry: { ...OFFICIAL_THRESHOLDS.chemistry.S1 },
        biology: { ...OFFICIAL_THRESHOLDS.biology.S1 }
      });

      // Raw marks input state (kept as strings to allow typing freely before parsing)
      const [marks, setMarks] = useState({
        physics: { p1: '', p2: '', p3: '' },
        chemistry: { p1: '', p2: '', p3: '' },
        biology: { p1: '', p2: '', p3: '' }
      });

      // --- What-If Variables ---
      const [whatIfSubject, setWhatIfSubject] = useState('physics');
      const [whatIfGrade, setWhatIfGrade] = useState('A');
      const [whatIfSolveFor, setWhatIfSolveFor] = useState('p3'); // p1, p2, or p3
      const [whatIfKnownVal1, setWhatIfKnownVal1] = useState('');
      const [whatIfKnownVal2, setWhatIfKnownVal2] = useState('');

      const maxMarks = { p1: 40, p2: 60, p3: 40 };
      const weights = { p1: 1.0, p2: 1.0, p3: 0.75 };

      // Helper for safely retrieving thresholds if inputs are empty
      const getSafeThreshold = (subject, grade) => {
        const val = customThresholds[subject][grade];
        return (val === '' || isNaN(val)) ? 0 : parseFloat(val);
      };

      // Helper math calculation engine
      const calculateSubjectData = (subject) => {
        const rawP1 = parseFloat(marks[subject].p1) || 0;
        const rawP2 = parseFloat(marks[subject].p2) || 0;
        const rawP3 = parseFloat(marks[subject].p3) || 0;

        const weightedP1 = rawP1 * weights.p1;
        const weightedP2 = rawP2 * weights.p2;
        const weightedP3 = rawP3 * weights.p3;

        const weightedTotal = Math.round((weightedP1 + weightedP2 + weightedP3) * 100) / 100;
        const percentage = Math.round((weightedTotal / 130) * 100 * 10) / 10;

        // Ensure calculations use numeric values even if strings are in state
        const safeA = getSafeThreshold(subject, 'A');
        const safeB = getSafeThreshold(subject, 'B');
        const safeC = getSafeThreshold(subject, 'C');
        const safeD = getSafeThreshold(subject, 'D');
        const safeE = getSafeThreshold(subject, 'E');

        let grade = 'U';
        if (weightedTotal >= safeA) grade = 'A';
        else if (weightedTotal >= safeB) grade = 'B';
        else if (weightedTotal >= safeC) grade = 'C';
        else if (weightedTotal >= safeD) grade = 'D';
        else if (weightedTotal >= safeE) grade = 'E';

        const hasAnyInput = marks[subject].p1 !== '' || marks[subject].p2 !== '' || marks[subject].p3 !== '';

        return {
          rawP1, rawP2, rawP3,
          weightedP1, weightedP2, weightedP3,
          weightedTotal, percentage, grade,
          hasAnyInput
        };
      };

      const physicsData = calculateSubjectData('physics');
      const chemistryData = calculateSubjectData('chemistry');
      const biologyData = calculateSubjectData('biology');

      const handleMarkChange = (subject, paper, val) => {
        if (val === '') {
          setMarks(prev => ({ ...prev, [subject]: { ...prev[subject], [paper]: '' } }));
          return;
        }
        
        let num = parseInt(val, 10);
        if (isNaN(num)) return;
        
        // Prevent values out of bounds seamlessly
        if (num > maxMarks[paper]) num = maxMarks[paper];
        if (num < 0) num = 0;
        
        setMarks(prev => ({
          ...prev,
          [subject]: { ...prev[subject], [paper]: num.toString() }
        }));
      };

      // Safely updates variant AND syncing thresholds immediately (avoids useEffect race condition crashes)
      const handlePresetVariantChange = (subject, variantKey) => {
        setSelectedVariants(prev => ({
          ...prev,
          [subject]: variantKey
        }));
        setCustomThresholds(prev => ({
          ...prev,
          [subject]: { ...OFFICIAL_THRESHOLDS[subject][variantKey] }
        }));
      };

      const fillDemoMarks = () => {
        setMarks({
          physics: { p1: '34', p2: '46', p3: '32' },
          chemistry: { p1: '31', p2: '40', p3: '28' },
          biology: { p1: '33', p2: '45', p3: '31' }
        });
      };

      const clearAllMarks = () => {
        setMarks({
          physics: { p1: '', p2: '', p3: '' },
          chemistry: { p1: '', p2: '', p3: '' },
          biology: { p1: '', p2: '', p3: '' }
        });
      };

      const copySummary = async () => {
        let txt = `=== CIE AS-LEVEL SCIENCE SCORE REPORT ===\n`;
        if (studentName) txt += `Student: ${studentName}\n`;
        txt += `Calculated using official June 2025 Grade Thresholds.\n\n`;

        ['physics', 'chemistry', 'biology'].forEach(sub => {
          const data = calculateSubjectData(sub);
          if (data.hasAnyInput) {
            txt += `${sub.toUpperCase()} (${OFFICIAL_THRESHOLDS[sub][selectedVariants[sub]].name}):\n`;
            txt += ` - P1 MCQ: ${marks[sub].p1 || 0}/40\n`;
            txt += ` - P2 Theory: ${marks[sub].p2 || 0}/60\n`;
            txt += ` - P3 Practical: ${marks[sub].p3 || 0}/40 (Weighted: ${data.weightedP3}/30)\n`;
            txt += ` - Weighted Total: ${data.weightedTotal}/130 (${data.percentage}%)\n`;
            txt += ` - Projected Grade: ${data.grade}\n\n`;
          }
        });
        txt += `Generated on Cambridge Weighted Grade Assistant.`;

        // Modern clipboard with robust fallback
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
             await navigator.clipboard.writeText(txt);
          } else {
             const textarea = document.createElement('textarea');
             textarea.value = txt;
             document.body.appendChild(textarea);
             textarea.select();
             document.execCommand('copy');
             document.body.removeChild(textarea);
          }
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (err) {
          console.error("Copy failed", err);
        }
      };

      // --- CRASH-PROOF WHAT-IF CALCULATION LOGIC ---
      const computeWhatIf = () => {
        const targetWeightedScore = getSafeThreshold(whatIfSubject, whatIfGrade);

        const val1 = parseFloat(whatIfKnownVal1) || 0;
        const val2 = parseFloat(whatIfKnownVal2) || 0;

        let knownWeighted = 0;
        let neededWeighted = 0;
        let neededRaw = 0;
        let solvedPaperName = '';
        let inputLabel1 = '';
        let inputLabel2 = '';
        let maxAllowedRaw = 40;

        if (whatIfSolveFor === 'p3') {
          solvedPaperName = "Paper 3 (Practical)";
          maxAllowedRaw = 40;
          inputLabel1 = "Paper 1 (MCQ) Mark";
          inputLabel2 = "Paper 2 (AS Structured) Mark";
          knownWeighted = (val1 * weights.p1) + (val2 * weights.p2);
          neededWeighted = targetWeightedScore - knownWeighted;
          neededRaw = neededWeighted / weights.p3;
        } else if (whatIfSolveFor === 'p2') {
          solvedPaperName = "Paper 2 (AS Structured)";
          maxAllowedRaw = 60;
          inputLabel1 = "Paper 1 (MCQ) Mark";
          inputLabel2 = "Paper 3 (Practical) Mark";
          knownWeighted = (val1 * weights.p1) + (val2 * weights.p3);
          neededWeighted = targetWeightedScore - knownWeighted;
          neededRaw = neededWeighted / weights.p2;
        } else {
          solvedPaperName = "Paper 1 (MCQ)";
          maxAllowedRaw = 40;
          inputLabel1 = "Paper 2 (AS Structured) Mark";
          inputLabel2 = "Paper 3 (Practical) Mark";
          knownWeighted = (val1 * weights.p2) + (val2 * weights.p3);
          neededWeighted = targetWeightedScore - knownWeighted;
          neededRaw = neededWeighted / weights.p1;
        }

        // Must ceil to next full mark
        const roundedRawResult = Math.ceil(neededRaw); 
        const isPossible = roundedRawResult <= maxAllowedRaw;
        const isAlreadySecured = roundedRawResult <= 0;

        return {
          solvedPaperName,
          inputLabel1,
          inputLabel2,
          maxAllowedRaw,
          targetWeightedScore,
          knownWeighted,
          neededRaw: roundedRawResult,
          isPossible,
          isAlreadySecured
        };
      };

      const whatIfResult = computeWhatIf();

      // Reliable helper for establishing current bracket to highlight without breaking array references
      const getActiveGradeBracket = (total, subject) => {
         if (total >= getSafeThreshold(subject, 'A')) return 'A';
         if (total >= getSafeThreshold(subject, 'B')) return 'B';
         if (total >= getSafeThreshold(subject, 'C')) return 'C';
         if (total >= getSafeThreshold(subject, 'D')) return 'D';
         if (total >= getSafeThreshold(subject, 'E')) return 'E';
         return 'U';
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between">
          
          {/* Header Bar */}
          <header className="border-b border-slate-900 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-gradient-to-br from-teal-500 to-emerald-600 rounded-xl shadow-lg shadow-teal-500/15">
                  <Icons.Calculator />
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight bg-gradient-to-r from-teal-200 via-slate-100 to-emerald-200 bg-clip-text text-transparent">
                    CAIE AS-Level Science Weighted Calculator
                  </h1>
                  <p className="text-xs text-slate-400">June 2025 Grade Boundaries • Real Weighting Math</p>
                </div>
              </div>

              {/* Action Controls */}
              <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-end">
                <input 
                  type="text" 
                  placeholder="Student Name (Optional)"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  className="bg-slate-900 border border-slate-800 text-sm px-3.5 py-1.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-100 placeholder:text-slate-500 w-full sm:w-48"
                />
                <button
                  onClick={fillDemoMarks}
                  className="px-3 py-1.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-slate-300 transition-all active:scale-95"
                  title="Populate mock high-performance marks"
                >
                  <Icons.Sparkles className="w-3.5 h-3.5 text-yellow-400" /> Fill Demo Marks
                </button>
                <button
                  onClick={clearAllMarks}
                  className="px-3 py-1.5 bg-rose-950/40 hover:bg-rose-950/70 border border-rose-900/50 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-rose-300 transition-all active:scale-95"
                >
                  <Icons.RotateCcw className="w-3.5 h-3.5" /> Reset
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 w-full flex-grow">
            
            {/* CIE Science Weighting Factbox */}
            <div className="bg-gradient-to-r from-blue-950/40 via-slate-900 to-slate-900/40 border border-blue-900/40 rounded-2xl p-5 mb-8 flex flex-col md:flex-row md:items-center gap-5 justify-between animate-fadeIn">
              <div className="flex gap-4 items-start">
                <div className="p-3 bg-blue-500/10 rounded-xl shrink-0 mt-0.5">
                  <Icons.Info className="w-6 h-6 text-blue-400" />
                </div>
                <div>
                  <h4 className="text-sm font-semibold text-blue-300">Cambridge Scaling Mechanism Explained</h4>
                  <p className="text-xs text-slate-300 leading-relaxed mt-1 max-w-4xl">
                    Although raw totals for AS Physics, Chemistry, and Biology sum to <strong className="text-white">140 marks</strong> (P1: 40, P2: 60, P3: 40), CAIE scales the practical component (P3) by a factor of <strong className="text-white">0.75</strong>. This changes P3's contribution from 40 down to 30 weighted marks, resulting in a grand syllabus total of <strong className="text-white">130 marks</strong>.
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-2 font-mono text-xs text-slate-400 shrink-0 border-t md:border-t-0 border-slate-800 pt-3 md:pt-0">
                <div className="bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-800">P1 Weight: 1.0</div>
                <div className="bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-800">P2 Weight: 1.0</div>
                <div className="bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-800">P3 Weight: 0.75</div>
              </div>

                              <span>{subData.rawP3} × 0.75 = <strong className="text-rose-400">{subData.weightedP3}</strong></span>
                            </div>

                            <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between font-sans">
                              <div>
                                <span className="text-xs font-bold text-slate-200">Total Weighted Mark</span>
                                <p className="text-[10px] text-slate-500 font-sans">Grand syllabus total relative to max marks</p>
                              </div>
                              <span className="text-2xl font-black text-teal-400 font-mono">{subData.weightedTotal} <span className="text-xs text-slate-500 font-sans">/ 130</span></span>
                            </div>
                          </div>
                        </div>

                        {/* Gauges */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
                            <div>
                              <span className="text-xs text-slate-400 uppercase tracking-wider">Weighted Percentage</span>
                              <h4 className="text-4xl font-black mt-2 text-teal-400 font-mono">{subData.percentage}%</h4>
                              <p className="text-[11px] text-slate-500 mt-1">Weighted total divided by 130.</p>
                            </div>
                            <div className="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden mt-4">
                              <div className="bg-teal-500 h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(subData.percentage, 100)}%` }}></div>
                            </div>
                          </div>

                          <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
                            <div>
                              <span className="text-xs text-slate-400 uppercase tracking-wider">Estimated Syllabus Grade</span>
                              <div className="flex items-baseline gap-2 mt-2">
                                <h4 className="text-5xl font-black text-white">{subData.grade}</h4>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-1 font-sans">Using June 2025 variant boundaries.</p>
                            </div>
                          </div>
                        </div>

                        {/* Boundaries tracker list */}
                        <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-6">
                          <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wide mb-4">Syllabus Grade Boundaries Tracker (Marks out of 130)</h4>
                          <div className="grid grid-cols-5 gap-3 font-sans">
                            {['A', 'B', 'C', 'D', 'E'].map((letter) => {
                              const limit = getSafeThreshold(activeTab, letter);
                              const isCurrentGrade = currentGradeLetter === letter;
                              return (
                                <div key={letter} className={`p-3 rounded-xl border text-center transition-all ${isCurrentGrade ? 'bg-teal-500/10 border-teal-500/50 text-teal-400' : 'bg-slate-950/40 border-slate-800 text-slate-400'}`}>
                                  <div className="text-xs font-bold font-mono">Grade {letter}</div>
                                  <div className="text-lg font-black mt-1 font-mono">{limit}</div>
                                  <div className="text-[9px] text-slate-500 font-sans">Marks +</div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                      </div>
                    );
                  })()}
                </div>

              </div>
            )}

            {/* --- THRESHOLD CUSTOMIZATION TAB --- */}
            {activeTab === 'thresholds' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-pink-950/20 border border-pink-900/40 rounded-2xl p-5 flex items-start gap-4">
                  <Icons.AlertCircle className="w-6 h-6 text-pink-400 shrink-0 mt-0.5" />
                  <div>
                    <h4 className="text-sm font-semibold text-pink-300 font-sans">Active Grade Threshold Boundaries (May/June 2025 Series)</h4>
                    <p className="text-xs text-slate-300 leading-relaxed mt-1">
                      These values are pre-filled directly with the official Cambridge June 2025 grade boundaries taken from the published tables. You can select your variant on the dashboard, and these tables will adjust. To simulate a custom curve, type directly into any threshold block below.
                    </p>
                  </div>
                </div>

                <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-6">
                  <h3 className="text-sm font-bold text-slate-200 mb-6">Subject Grade Threshold Boundaries editor (Out of 130 weighted marks)</h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {['physics', 'chemistry', 'biology'].map((subject) => (
                      <div key={subject} className="bg-slate-950/40 border border-slate-800 rounded-2xl p-5">
                        <div className="flex items-center gap-2 mb-4">
                          <span className={`w-2.5 h-2.5 rounded-full ${subject === 'physics' ? 'bg-cyan-500' : subject === 'chemistry' ? 'bg-violet-500' : 'bg-emerald-500'}`}></span>
                          <h4 className="text-xs font-bold capitalize text-slate-300">{subject} Thresholds</h4>
                        </div>

                        <div className="space-y-3 text-xs">
                          {['A', 'B', 'C', 'D', 'E'].map((letter) => (
                            <div key={letter} className="flex items-center justify-between">
                              <span className="text-slate-400 font-mono">Grade {letter}:</span>
                              <input
                                type="number"
                                min="0"
                                max="130"
                                value={customThresholds[subject][letter]}
                                onChange={(e) => {
                                  // Preserve the raw string while typing so inputs don't frustratingly reset to 0
                                  const val = e.target.value; 
                                  setCustomThresholds(prev => ({
                                    ...prev,
                                    [subject]: {
                                      ...prev[subject],
                                      [letter]: val
                                    }
                                  }));
                                }}
                                className="bg-slate-900 border border-slate-800 rounded-md py-1 px-2.5 w-20 text-center text-slate-100 focus:outline-none focus:ring-1 focus:ring-pink-500 font-mono"
                              />
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* --- CRASH-PROOF WHAT-IF CALCULATION TAB --- */}
            {activeTab === 'whatif' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 opacity-5 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-full blur-2xl"></div>
                  
                  <div>
                    <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                      <Icons.TrendingUp className="text-amber-500" /> "What-If" Simulator & Solver Tool
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">Compute the required raw score on an upcoming or missing paper to guarantee your target AS Grade.</p>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mt-6 pt-6 border-t border-slate-800/80">
                    
                    {/* Setup controls */}
                    <div className="lg:col-span-5 space-y-6">
                      
                      <div className="space-y-4">
                        {/* Choose subject */}
                        <div>
                          <label className="text-xs font-semibold text-slate-300 block mb-1.5">Target Subject</label>
                          <select
                            value={whatIfSubject}
                            onChange={(e) => setWhatIfSubject(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 text-xs py-2 px-3 rounded-lg text-slate-200 focus:outline-none focus:ring-1 focus:ring-amber-500"
                          >
                            <option value="physics">Physics (9702)</option>
                            <option value="chemistry">Chemistry (9701)</option>
                            <option value="biology">Biology (9700)</option>
                          </select>
                        </div>

                        {/* Choose Grade Target */}
                        <div>
                          <label className="text-xs font-semibold text-slate-300 block mb-1.5">Target Grade Goal</label>
                          <select
                            value={whatIfGrade}
                            onChange={(e) => setWhatIfGrade(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 text-xs py-2 px-3 rounded-lg text-slate-200 focus:outline-none focus:ring-1 focus:ring-amber-500 font-mono"
                          >
                            <option value="A">Grade A</option>
                            <option value="B">Grade B</option>
                            <option value="C">Grade C</option>
                            <option value="D">Grade D</option>
                            <option value="E">Grade E</option>
                          </select>
                        </div>

                        {/* Solve selection */}
                        <div>
                          <label className="text-xs font-semibold text-slate-300 block mb-1.5">Paper to Solve For</label>
                          <select
                            value={whatIfSolveFor}
                            onChange={(e) => {
                              setWhatIfSolveFor(e.target.value);
                              // Clear inputs safely on selection switch
                              setWhatIfKnownVal1('');
                              setWhatIfKnownVal2('');
                            }}
                            className="w-full bg-slate-950 border border-slate-800 text-xs py-2 px-3 rounded-lg text-slate-200 focus:outline-none focus:ring-1 focus:ring-amber-500"
                          >
                            <option value="p3">Solve For: Paper 3 (Practical - Max 40)</option>
                            <option value="p2">Solve For: Paper 2 (AS Structured Questions - Max 60)</option>
                            <option value="p1">Solve For: Paper 1 (Multiple Choice - Max 40)</option>
                          </select>
                        </div>
                      </div>

                      {/* Inputs for Known Papers */}
                      <div className="space-y-4 pt-4 border-t border-slate-800">
                        <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Provide Your Known Scores</h4>

                        <div className="space-y-3">
                          <div className="space-y-1.5">
                            <label className="text-xs text-slate-400 block">{whatIfResult.inputLabel1}</label>
                            <input
                              type="number"
                              placeholder="Enter mark"
                              value={whatIfKnownVal1}
                              onChange={(e) => setWhatIfKnownVal1(e.target.value)}
                              className="w-full bg-slate-950 border border-slate-800 rounded-lg text-xs py-2 px-3 text-slate-100 focus:outline-none focus:ring-1 focus:ring-amber-500 font-mono"
                            />
                          </div>

                          <div className="space-y-1.5">
                            <label className="text-xs text-slate-400 block">{whatIfResult.inputLabel2}</label>
                            <input
                              type="number"
                              placeholder="Enter mark"
                              value={whatIfKnownVal2}
                              onChange={(e) => setWhatIfKnownVal2(e.target.value)}
                              className="w-full bg-slate-950 border border-slate-800 rounded-lg text-xs py-2 px-3 text-slate-100 focus:outline-none focus:ring-1 focus:ring-amber-500 font-mono"
                            />
                          </div>
                        </div>
                      </div>

                    </div>

                    {/* Solver output results */}
                    <div className="lg:col-span-7 flex flex-col justify-center">
                      <div className="bg-slate-950/60 border border-slate-800 p-6 rounded-3xl space-y-6">
                        <div>
                          <span className="text-xs text-slate-400 uppercase tracking-wider">Required Target Score</span>
                          <div className="flex items-baseline gap-2 mt-1">
                            <h4 className="text-3xl font-black text-slate-100 font-mono">{whatIfResult.targetWeightedScore}</h4>
                            <span className="text-xs text-slate-400">weighted marks required out of 130</span>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4 py-4 border-y border-slate-800 text-xs">
                          <div>
                            <span className="text-slate-500 block">Syllabus Target</span>
                            <span className="font-bold capitalize text-amber-400">{whatIfSubject} Grade {whatIfGrade}</span>
                          </div>
                          <div>
                            <span className="text-slate-500 block">Current Cumulative Weighted Marks</span>
                            <span className="font-bold text-slate-200 font-mono">{whatIfResult.knownWeighted} / 130</span>
                          </div>
                        </div>

                        <div className="pt-2 text-center">
                          {whatIfResult.isAlreadySecured ? (
                            <div className="p-4 bg-emerald-500/15 border border-emerald-500/30 rounded-2xl text-emerald-400">
                              <span className="text-xs font-bold uppercase tracking-wider block font-sans">Target Reached!</span>
                              <p className="text-lg font-black mt-1">Grade {whatIfGrade} Already Secured!</p>
                              <p className="text-[11px] text-slate-400 mt-1 font-sans">Your existing marks have exceeded the boundary requirement.</p>
                            </div>
                          ) : !whatIfResult.isPossible ? (
                            <div className="p-4 bg-rose-500/15 border border-rose-500/30 rounded-2xl text-rose-400 font-sans">
                              <span className="text-xs font-bold uppercase tracking-wider block">Mathematical Limit reached</span>
                              <p className="text-lg font-black mt-1">Target Not Achievable</p>
                              <p className="text-[11px] text-slate-400 mt-1">
                                You would need a raw mark of <strong className="font-mono text-rose-300">{whatIfResult.neededRaw}</strong> on {whatIfResult.solvedPaperName}, which exceeds the max paper limit of {whatIfResult.maxAllowedRaw}.
                              </p>
                            </div>
                          ) : (
                            <div className="p-5 bg-amber-500/15 border border-amber-500/30 rounded-2xl text-amber-400">
                              <span className="text-xs font-bold uppercase tracking-wider block font-sans">Minimum Mark Needed</span>
                              <p className="text-4xl font-black mt-2 font-mono">
                                {whatIfResult.neededRaw} <span className="text-lg font-normal">/ {whatIfResult.maxAllowedRaw}</span>
                              </p>
                              <p className="text-xs text-slate-300 mt-2 leading-relaxed">
                                You must score at least <strong className="text-white font-mono">{whatIfResult.neededRaw}</strong> raw marks on <strong className="text-white uppercase">{whatIfResult.solvedPaperName}</strong> to achieve a final weighted score above {whatIfResult.targetWeightedScore} for grade {whatIfGrade}.
                              </p>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="max-w-7xl mx-auto px-4 text-center text-slate-600 text-[11px] mt-12 py-6 border-t border-slate-900 w-full">
            <p>© 2026 Cambridge AS Weighted Grade Assistant. Specially calibrated for Physics, Chemistry, and Biology syllabuses.</p>
            <p className="mt-1">All grade boundaries are extracted from official CAIE June 2025 threshold records.</p>
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
