<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIE Science Grade Engine (June 2025)</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Config for Custom Design System -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            glass: {
              100: 'rgba(255, 255, 255, 0.03)',
              200: 'rgba(255, 255, 255, 0.05)',
              300: 'rgba(255, 255, 255, 0.08)',
            },
            surface: '#0a0a0c',
            physics: '#38bdf8',
            chemistry: '#c084fc',
            biology: '#34d399',
          },
          backgroundImage: {
            'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E')",
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'float-delayed': 'float 6s ease-in-out 3s infinite',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            slideUp: {
              '0%': { opacity: 0, transform: 'translateY(16px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: 0.5 },
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Custom Modern Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    
    /* Input Number Reset */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    /* Glass Panels */
    .glass-panel {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    
    .glass-button {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }
    .glass-button:active { transform: translateY(1px); }

    /* Highlighted Tabs */
    .tab-active {
      background: white;
      color: black;
      box-shadow: 0 4px 12px rgba(255,255,255,0.15);
    }
    .tab-inactive {
      color: #888;
    }
    .tab-inactive:hover {
      color: #fff;
    }
  </style>
</head>
<body class="bg-surface text-slate-200 antialiased min-h-screen selection:bg-white/30 selection:text-white relative overflow-x-hidden">
  
  <!-- Ambient Background Mesh Gradients -->
  <div class="fixed inset-0 z-[-2] opacity-[0.15] bg-noise pointer-events-none mix-blend-overlay"></div>
  <div class="fixed top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-physics/20 blur-[120px] pointer-events-none animate-float"></div>
  <div class="fixed bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-biology/20 blur-[120px] pointer-events-none animate-float-delayed"></div>
  <div class="fixed top-[20%] right-[10%] w-[30vw] h-[30vw] rounded-full bg-chemistry/10 blur-[100px] pointer-events-none"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icons = {
      Calculator: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="16"></line><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="22" x2="16" y2="16"></line><line x1="9" y1="16" x2="16" y2="16"></line><line x1="9" y1="12" x2="16" y2="12"></line><line x1="9" y1="16" x2="9" y2="12"></line><line x1="16" y1="16" x2="16" y2="12"></line></svg>,
      Award: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>,
      Sliders: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="2" y1="14" x2="6" y2="14"></line><line x1="10" y1="8" x2="14" y2="8"></line><line x1="18" y1="16" x2="22" y2="16"></line></svg>,
      BookOpen: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
      Copy: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
      Check: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
      Info: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>,
      TrendingUp: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
      Sparkles: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 5a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7z"></path></svg>,
      ArrowRight: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>,
      AlertCircle: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    };

    // High-end circular progress indicator
    const RadialProgress = ({ percentage, colorClass, label, subtitle }) => {
      const radius = 36;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (Math.min(percentage, 100) / 100) * circumference;

      // Extract raw color to apply to stroke since tailwind classes on SVG strokes can be tricky without mapped colors
      let strokeColor = "#38bdf8"; // default physics cyan
      if (colorClass.includes('chemistry') || colorClass.includes('purple')) strokeColor = "#c084fc";
      if (colorClass.includes('biology') || colorClass.includes('emerald')) strokeColor = "#34d399";
      if (colorClass === 'white') strokeColor = "#ffffff";

      return (
        <div className="flex flex-col items-center justify-center relative">
          <svg className="transform -rotate-90 w-28 h-28">
            {/* Background track */}
            <circle cx="56" cy="56" r={radius} stroke="currentColor" strokeWidth="6" fill="transparent" className="text-white/5" />
            {/* Animated progress ring */}
            <circle cx="56" cy="56" r={radius} stroke={strokeColor} strokeWidth="6" fill="transparent"
              strokeDasharray={circumference}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
              className="transition-all duration-1000 ease-out"
            />
          </svg>
          <div className="absolute flex flex-col items-center justify-center">
            <span className="font-mono text-2xl font-bold tracking-tighter" style={{ color: strokeColor }}>{percentage}%</span>
          </div>
          <div className="mt-3 text-center">
            <h4 className="text-sm font-semibold text-white">{label}</h4>
            <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>
          </div>
        </div>
      );
    };

    const OFFICIAL_THRESHOLDS = {
      physics: {
        S1: { name: "Variant 11, 21, 31 (Option S1)", A: 94, B: 85, C: 73, D: 62, E: 51 },
        S2: { name: "Variant 11, 21, 32 (Option S2)", A: 94, B: 83, C: 72, D: 61, E: 50 },
        S3: { name: "Variant 12, 22, 33 (Option S3)", A: 97, B: 85, C: 72, D: 59, E: 46 },
        S4: { name: "Variant 12, 22, 34 (Option S4)", A: 96, B: 83, C: 70, D: 57, E: 45 },
        S5: { name: "Variant 13, 23, 35 (Option S5)", A: 95, B: 83, C: 70, D: 58, E: 46 },
      },
      biology: {
        S1: { name: "Variant 11, 21, 31 (Option S1)", A: 90, B: 80, C: 69, D: 59, E: 49 },
        S2: { name: "Variant 11, 21, 32 (Option S2)", A: 90, B: 81, C: 70, D: 60, E: 50 },
        S3: { name: "Variant 12, 22, 33 (Option S3)", A: 85, B: 73, C: 63, D: 53, E: 43 },
        S4: { name: "Variant 12, 22, 34 (Option S4)", A: 86, B: 75, C: 65, D: 55, E: 45 },
        S5: { name: "Variant 13, 23, 35 (Option S5)", A: 94, B: 84, C: 74, D: 65, E: 56 },
      },
      chemistry: {
        S1: { name: "Variant 11, 21, 31 (Option S1)", A: 92, B: 78, C: 64, D: 51, E: 38 },
        S2: { name: "Variant 11, 21, 32 (Option S2)", A: 91, B: 77, C: 63, D: 50, E: 37 },
        S3: { name: "Variant 12, 22, 33 (Option S3)", A: 94, B: 80, C: 66, D: 52, E: 38 },
        S4: { name: "Variant 12, 22, 34 (Option S4)", A: 93, B: 79, C: 65, D: 51, E: 37 },
        S5: { name: "Variant 13, 23, 35 (Option S5)", A: 93, B: 79, C: 65, D: 52, E: 39 },
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [copied, setCopied] = useState(false);

      const [selectedVariants, setSelectedVariants] = useState({
        physics: 'S1', chemistry: 'S1', biology: 'S1'
      });

      const [customThresholds, setCustomThresholds] = useState({
        physics: { ...OFFICIAL_THRESHOLDS.physics.S1 },
        chemistry: { ...OFFICIAL_THRESHOLDS.chemistry.S1 },
        biology: { ...OFFICIAL_THRESHOLDS.biology.S1 }
      });

      const [marks, setMarks] = useState({
        physics: { p1: '', p2: '', p3: '' },
        chemistry: { p1: '', p2: '', p3: '' },
        biology: { p1: '', p2: '', p3: '' }
      });

      const [whatIfSubject, setWhatIfSubject] = useState('physics');
      const [whatIfGrade, setWhatIfGrade] = useState('A');
      const [whatIfSolveFor, setWhatIfSolveFor] = useState('p3');
      const [whatIfKnownVal1, setWhatIfKnownVal1] = useState('');
      const [whatIfKnownVal2, setWhatIfKnownVal2] = useState('');

      const maxMarks = { p1: 40, p2: 60, p3: 40 };
      const weights = { p1: 1.0, p2: 1.0, p3: 0.75 };

      const getSafeThreshold = (subject, grade) => {
        const val = customThresholds[subject][grade];
        return (val === '' || isNaN(val)) ? 0 : parseFloat(val);
      };

      const calculateSubjectData = (subject) => {
        const rawP1 = parseFloat(marks[subject].p1) || 0;
        const rawP2 = parseFloat(marks[subject].p2) || 0;
        const rawP3 = parseFloat(marks[subject].p3) || 0;

        const weightedP1 = rawP1 * weights.p1;
        const weightedP2 = rawP2 * weights.p2;
        const weightedP3 = rawP3 * weights.p3;

        const weightedTotal = Math.round((weightedP1 + weightedP2 + weightedP3) * 100) / 100;
        const percentage = Math.round((weightedTotal / 130) * 100 * 10) / 10;

        const thresholds = customThresholds[subject];
        let grade = 'U';
        if (weightedTotal >= thresholds.A) grade = 'A';
        else if (weightedTotal >= thresholds.B) grade = 'B';
        else if (weightedTotal >= thresholds.C) grade = 'C';
        else if (weightedTotal >= thresholds.D) grade = 'D';
        else if (weightedTotal >= thresholds.E) grade = 'E';

        const hasAnyInput = marks[subject].p1 !== '' || marks[subject].p2 !== '' || marks[subject].p3 !== '';

        return { rawP1, rawP2, rawP3, weightedP1, weightedP2, weightedP3, weightedTotal, percentage, grade, hasAnyInput };
      };

      const physicsData = calculateSubjectData('physics');
      const chemistryData = calculateSubjectData('chemistry');
      const biologyData = calculateSubjectData('biology');

      const handleMarkChange = (subject, paper, val) => {
        if (val === '') {
          setMarks(prev => ({ ...prev, [subject]: { ...prev[subject], [paper]: '' } }));
          return;
        }
        let num = parseInt(val, 10);
        if (isNaN(num)) return;
        if (num > maxMarks[paper]) num = maxMarks[paper];
        if (num < 0) num = 0;
        setMarks(prev => ({ ...prev, [subject]: { ...prev[subject], [paper]: num.toString() } }));
      };

      const handlePresetVariantChange = (subject, variantKey) => {
        setSelectedVariants(prev => ({ ...prev, [subject]: variantKey }));
        setCustomThresholds(prev => ({ ...prev, [subject]: { ...OFFICIAL_THRESHOLDS[subject][variantKey] } }));
      };

      const computeWhatIf = () => {
        const targetWeightedScore = getSafeThreshold(whatIfSubject, whatIfGrade);
        const val1 = parseFloat(whatIfKnownVal1) || 0;
        const val2 = parseFloat(whatIfKnownVal2) || 0;

        let knownWeighted = 0, neededWeighted = 0, neededRaw = 0;
        let solvedPaperName = '', inputLabel1 = '', inputLabel2 = '', maxAllowedRaw = 40;

        if (whatIfSolveFor === 'p3') {
          solvedPaperName = "Paper 3 (Practical)"; maxAllowedRaw = 40;
          inputLabel1 = "Paper 1 (MCQ) Mark"; inputLabel2 = "Paper 2 (AS Structured) Mark";
          knownWeighted = (val1 * weights.p1) + (val2 * weights.p2);
          neededRaw = (targetWeightedScore - knownWeighted) / weights.p3;
        } else if (whatIfSolveFor === 'p2') {
          solvedPaperName = "Paper 2 (AS Structured)"; maxAllowedRaw = 60;
          inputLabel1 = "Paper 1 (MCQ) Mark"; inputLabel2 = "Paper 3 (Practical) Mark";
          knownWeighted = (val1 * weights.p1) + (val2 * weights.p3);
          neededRaw = (targetWeightedScore - knownWeighted) / weights.p2;
        } else {
          solvedPaperName = "Paper 1 (MCQ)"; maxAllowedRaw = 40;
          inputLabel1 = "Paper 2 (AS Structured) Mark"; inputLabel2 = "Paper 3 (Practical) Mark";
          knownWeighted = (val1 * weights.p2) + (val2 * weights.p3);
          neededRaw = (targetWeightedScore - knownWeighted) / weights.p1;
        }

        const roundedRawResult = Math.ceil(neededRaw); 
        return {
          solvedPaperName, inputLabel1, inputLabel2, maxAllowedRaw, targetWeightedScore, knownWeighted,
          neededRaw: roundedRawResult, isPossible: roundedRawResult <= maxAllowedRaw, isAlreadySecured: roundedRawResult <= 0
        };
      };

      const whatIfResult = computeWhatIf();

      return (
        <div className="flex flex-col min-h-screen relative z-10 font-sans">
          
          {/* Floating Header */}
          <div className="pt-6 px-4 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto mb-8 animate-slide-up">
            <header className="glass-panel rounded-3xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-4 pl-2">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-white/20 to-white/5 border border-white/10 flex items-center justify-center shadow-xl">
                  <Icons.Calculator className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight text-white">CIE AS Grade Engine</h1>
                  <p className="text-sm font-medium text-white/50">June 2025 Real Weighting Model</p>
                </div>
              </div>
              
              <div className="flex items-center gap-3 pr-2">
                <button onClick={() => setMarks({
                    physics: { p1: '34', p2: '46', p3: '32' },
                    chemistry: { p1: '31', p2: '40', p3: '28' },
                    biology: { p1: '33', p2: '45', p3: '31' }
                  })}
                  className="glass-button px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 text-white"
                >
                  <Icons.Sparkles className="w-4 h-4 text-yellow-400" /> Demo
                </button>
                <button onClick={() => setMarks({
                    physics: { p1: '', p2: '', p3: '' },
                    chemistry: { p1: '', p2: '', p3: '' },
                    biology: { p1: '', p2: '', p3: '' }
                  })}
                  className="glass-button px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 text-red-400"
                >
                  Reset
                </button>
              </div>
            </header>
          </div>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-grow pb-24">
            
            <div className="flex justify-center mb-10 animate-slide-up" style={{animationDelay: '0.1s'}}>
              <div className="glass-panel p-1.5 rounded-full inline-flex gap-1 overflow-x-auto scrollbar-none w-full sm:w-auto">
                {[
                  { id: 'dashboard', icon: Icons.Award, label: 'Dashboard' },
                  { id: 'physics', label: 'Physics', color: 'bg-physics' },
                  { id: 'chemistry', label: 'Chemistry', color: 'bg-chemistry' },
                  { id: 'biology', label: 'Biology', color: 'bg-biology' },
                  { id: 'whatif', icon: Icons.TrendingUp, label: 'Targeter' },
                  { id: 'thresholds', icon: Icons.Sliders, label: 'Thresholds' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-5 py-2.5 rounded-full text-sm font-bold transition-all flex items-center gap-2 whitespace-nowrap ${
                      activeTab === tab.id ? 'tab-active' : 'tab-inactive'
                    }`}
                  >
                    {tab.icon && <tab.icon className="w-4 h-4" />}
                    {tab.color && <span className={`w-2 h-2 rounded-full ${tab.color} ${activeTab !== tab.id && 'opacity-60'}`}></span>}
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>

            {activeTab === 'dashboard' && (
              <div className="space-y-8 animate-slide-up" style={{animationDelay: '0.2s'}}>
                
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {/* Left Column: Overall Stats */}
                  <div className="lg:col-span-8 flex flex-col gap-6">
                    <div className="glass-panel rounded-3xl p-8 flex flex-col md:flex-row justify-between items-center gap-8 relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-[80px] -mr-32 -mt-32"></div>
                      
                      <div className="flex-1 space-y-4">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/10 text-xs font-semibold text-white/80">
                          <Icons.Info className="w-3.5 h-3.5" /> P3 scaling active (×0.75)
                        </div>
                        <h2 className="text-3xl font-extrabold text-white tracking-tight">Your Projected <br/> Academic Profile</h2>
                        <p className="text-sm text-white/50 leading-relaxed max-w-sm">
                          Calculations are based on 130 weighted syllabus marks against the official June 2025 variant thresholds.
                        </p>
                      </div>

                      <div className="flex gap-6 z-10 w-full md:w-auto justify-around border-t border-white/10 md:border-none pt-6 md:pt-0">
                        <RadialProgress percentage={physicsData.percentage} colorClass="text-physics" label="Physics" subtitle={physicsData.hasAnyInput ? physicsData.grade : '—'} />
                        <RadialProgress percentage={chemistryData.percentage} colorClass="text-chemistry" label="Chemistry" subtitle={chemistryData.hasAnyInput ? chemistryData.grade : '—'} />
                        <RadialProgress percentage={biologyData.percentage} colorClass="text-biology" label="Biology" subtitle={biologyData.hasAnyInput ? biologyData.grade : '—'} />
                      </div>
                    </div>

                    {/* Subject Drill-down Bento Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {[
                        { id: 'physics', data: physicsData, color: 'text-physics', bg: 'bg-physics', label: 'Physics 9702' },
                        { id: 'chemistry', data: chemistryData, color: 'text-chemistry', bg: 'bg-chemistry', label: 'Chemistry 9701' },
                        { id: 'biology', data: biologyData, color: 'text-biology', bg: 'bg-biology', label: 'Biology 9700' }
                      ].map((sub) => (
                        <div key={sub.id} className="glass-panel rounded-3xl p-6 group cursor-pointer hover:bg-white/[0.04] transition-colors" onClick={() => setActiveTab(sub.id)}>
                          <div className="flex justify-between items-start mb-6">
                            <div className="flex items-center gap-2">
                              <span className={`w-2.5 h-2.5 rounded-full ${sub.bg} shadow-[0_0_10px_rgba(255,255,255,0.3)]`}></span>
                              <h3 className="font-bold text-white text-sm">{sub.label}</h3>
                            </div>
                            <Icons.ArrowRight className="w-4 h-4 text-white/30 group-hover:text-white/80 transition-colors" />
                          </div>
                          
                          {sub.data.hasAnyInput ? (
                            <div>
                              <div className="flex items-end justify-between mb-2">
                                <span className={`text-4xl font-mono font-bold ${sub.color}`}>{sub.data.weightedTotal}</span>
                                <span className="text-2xl font-bold text-white mb-1">{sub.data.grade}</span>
                              </div>
                              <p className="text-[10px] text-white/40 uppercase tracking-widest font-semibold mb-4">/ 130 Marks</p>
                              <div className="w-full bg-black/40 rounded-full h-1 border border-white/5 overflow-hidden">
                                <div className={`${sub.bg} h-full rounded-full transition-all duration-1000 ease-out`} style={{ width: `${Math.min(sub.data.percentage, 100)}%` }}></div>
                              </div>
                            </div>
                          ) : (
                            <div className="py-6 text-center">
                              <span className="text-xs text-white/30 font-medium">No data entered</span>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Right Column: Settings & Presets */}
                  <div className="lg:col-span-4 flex flex-col gap-6">
                    <div className="glass-panel rounded-3xl p-6 h-full flex flex-col">
                      <h3 className="text-sm font-bold text-white mb-6 flex items-center gap-2">
                        <Icons.Sliders className="w-4 h-4 text-white/50" /> Boundary Presets
                      </h3>
                      
                      <div className="space-y-4 flex-1">
                        {['physics', 'chemistry', 'biology'].map(subject => (
                          <div key={subject} className="space-y-1.5">
                            <label className="text-xs font-semibold text-white/50 uppercase tracking-wider pl-1">{subject}</label>
                            <div className="relative">
                              <select
                                value={selectedVariants[subject]}
                                onChange={(e) => handlePresetVariantChange(subject, e.target.value)}
                                className="w-full appearance-none bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/30 focus:ring-1 focus:ring-white/30 transition-all font-mono"
                              >
                                {Object.keys(OFFICIAL_THRESHOLDS[subject]).map((k) => (
                                  <option key={k} value={k} className="bg-surface">{OFFICIAL_THRESHOLDS[subject][k].name}</option>
                                ))}
                              </select>
                              <div className="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-white/30">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="mt-6 pt-6 border-t border-white/10">
                        <button className="w-full glass-button py-3 rounded-xl text-sm font-bold text-white flex justify-center items-center gap-2" onClick={() => setActiveTab('thresholds')}>
                          View Exact Boundaries
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {['physics', 'chemistry', 'biology'].includes(activeTab) && (() => {
              const subData = calculateSubjectData(activeTab);
              const themeColor = activeTab === 'physics' ? 'text-physics border-physics bg-physics' : activeTab === 'chemistry' ? 'text-chemistry border-chemistry bg-chemistry' : 'text-biology border-biology bg-biology';
              const textTheme = activeTab === 'physics' ? 'text-physics' : activeTab === 'chemistry' ? 'text-chemistry' : 'text-biology';
              const bgTheme = activeTab === 'physics' ? 'bg-physics' : activeTab === 'chemistry' ? 'bg-chemistry' : 'bg-biology';

              return (
                <div className="animate-slide-up" style={{animationDelay: '0.1s'}}>
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    {/* Left: Input Panel */}
                    <div className="lg:col-span-5 flex flex-col gap-6">
                      <div className="glass-panel rounded-3xl p-8 relative overflow-hidden">
                        <div className={`absolute top-[-20%] right-[-20%] w-64 h-64 ${bgTheme} opacity-10 rounded-full blur-[60px]`}></div>
                        
                        <div className="mb-8">
                          <h2 className="text-2xl font-extrabold capitalize text-white mb-2">{activeTab} Entry</h2>
                          <p className="text-sm text-white/50">Enter raw marks exactly as scored on scripts.</p>
                        </div>

                        <div className="space-y-6">
                          {[
                            { id: 'p1', label: 'Paper 1 (MCQ)', max: 40, weight: '× 1.00' },
                            { id: 'p2', label: 'Paper 2 (AS Structured)', max: 60, weight: '× 1.00' },
                            { id: 'p3', label: 'Paper 3 (Practical Skills)', max: 40, weight: '× 0.75', highlight: true }
                          ].map(paper => (
                            <div key={paper.id} className="relative group">
                              <div className="flex justify-between items-end mb-2">
                                <label className="text-sm font-bold text-white/90">{paper.label}</label>
                                <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded-full ${paper.highlight ? 'bg-white/10 text-white' : 'text-white/40'}`}>
                                  Max: {paper.max} | W: {paper.weight}
                                </span>
                              </div>
                              <div className="relative flex items-center">
                                <input
                                  type="number"
                                  value={marks[activeTab][paper.id]}
                                  onChange={(e) => handleMarkChange(activeTab, paper.id, e.target.value)}
                                  className="w-full bg-black/30 border border-white/10 rounded-2xl px-5 py-4 text-2xl text-white focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-all font-mono font-bold tracking-wider"
                                  placeholder="0"
                                />
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Right: Results Panel */}
                    <div className="lg:col-span-7 flex flex-col gap-6">
                      <div className="glass-panel rounded-3xl p-8 h-full flex flex-col">
                        <h3 className="text-sm font-bold text-white/50 uppercase tracking-widest mb-8">Performance Engine</h3>
                        
                        <div className="grid grid-cols-2 gap-8 mb-10">
                          <div>
                            <p className="text-xs text-white/40 font-bold uppercase tracking-wider mb-2">Weighted Total</p>
                            <div className="flex items-baseline gap-2">
                              <span className={`text-6xl font-extrabold font-mono tracking-tighter ${textTheme}`}>{subData.weightedTotal}</span>
                              <span className="text-xl text-white/30 font-bold">/130</span>
                            </div>
                          </div>
                          <div>
                            <p className="text-xs text-white/40 font-bold uppercase tracking-wider mb-2">Projected Grade</p>
                            <span className="text-6xl font-extrabold text-white">{subData.grade}</span>
                          </div>
                        </div>

                        <div className="w-full bg-black/40 rounded-full h-2 border border-white/5 overflow-hidden mb-12">
                          <div className={`${bgTheme} h-full rounded-full transition-all duration-1000 ease-out relative`} style={{ width: `${Math.min(subData.percentage, 100)}%` }}>
                             <div className="absolute top-0 right-0 bottom-0 w-20 bg-gradient-to-r from-transparent to-white/30"></div>
                          </div>
                        </div>

                        <div className="mt-auto">
                          <h4 className="text-xs font-bold text-white/50 uppercase tracking-wider mb-4">Grade Matrix</h4>
                          <div className="grid grid-cols-5 gap-2 sm:gap-4">
                            {['A', 'B', 'C', 'D', 'E'].map(letter => {
                              const limit = getSafeThreshold(activeTab, letter);
                              const isActive = subData.grade === letter;
                              const isPassed = subData.weightedTotal >= limit;
                              return (
                                <div key={letter} className={`p-3 sm:p-4 rounded-2xl flex flex-col items-center justify-center border transition-all duration-300 ${
                                  isActive ? `bg-white text-black border-white scale-105 shadow-xl shadow-white/10` : 
                                  isPassed ? `bg-white/10 border-white/20 text-white` : 
                                  `bg-black/20 border-white/5 text-white/30`
                                }`}>
                                  <span className="text-lg sm:text-xl font-bold">{letter}</span>
                                  <span className="text-xs font-mono mt-1 opacity-80">{limit}</span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              );
            })()}

            {activeTab === 'whatif' && (
              <div className="animate-slide-up" style={{animationDelay: '0.1s'}}>
                <div className="glass-panel rounded-[2.5rem] p-8 md:p-12 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-white/5 rounded-full blur-[100px] pointer-events-none -mr-40 -mt-40"></div>
                  
                  <div className="max-w-xl mb-12">
                    <div className="w-12 h-12 bg-white/10 border border-white/20 rounded-xl flex items-center justify-center mb-6">
                       <Icons.TrendingUp className="w-6 h-6 text-white" />
                    </div>
                    <h2 className="text-3xl font-extrabold text-white tracking-tight mb-3">Target Matrix</h2>
                    <p className="text-sm text-white/50 leading-relaxed">Reverse-engineer the exact raw marks needed on your remaining papers to secure your target boundary.</p>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    {/* Setup Config */}
                    <div className="space-y-8">
                      <div className="grid grid-cols-2 gap-4">
                        <div className="space-y-2">
                          <label className="text-xs font-bold text-white/50 uppercase tracking-wider pl-1">Subject</label>
                          <select value={whatIfSubject} onChange={(e) => setWhatIfSubject(e.target.value)} className="w-full appearance-none bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold focus:outline-none focus:border-white/40">
                            <option value="physics">Physics</option>
                            <option value="chemistry">Chemistry</option>
                            <option value="biology">Biology</option>
                          </select>
                        </div>
                        <div className="space-y-2">
                          <label className="text-xs font-bold text-white/50 uppercase tracking-wider pl-1">Target Grade</label>
                          <select value={whatIfGrade} onChange={(e) => setWhatIfGrade(e.target.value)} className="w-full appearance-none bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold focus:outline-none focus:border-white/40">
                            {['A','B','C','D','E'].map(g => <option key={g} value={g}>Grade {g}</option>)}
                          </select>
                        </div>
                      </div>

                      <div className="space-y-2">
                        <label className="text-xs font-bold text-white/50 uppercase tracking-wider pl-1">Missing Paper (Solve For)</label>
                        <select value={whatIfSolveFor} onChange={(e) => { setWhatIfSolveFor(e.target.value); setWhatIfKnownVal1(''); setWhatIfKnownVal2(''); }} className="w-full appearance-none bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold focus:outline-none focus:border-white/40">
                          <option value="p3">Paper 3 (Practical)</option>
                          <option value="p2">Paper 2 (AS Theory)</option>
                          <option value="p1">Paper 1 (MCQ)</option>
                        </select>
                      </div>

                      <div className="p-6 bg-black/20 border border-white/5 rounded-2xl space-y-4">
                        <h4 className="text-xs font-bold text-white/40 uppercase tracking-wider">Known Marks Input</h4>
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="text-[10px] text-white/40 block mb-1.5 truncate">{whatIfResult.inputLabel1}</label>
                            <input type="number" value={whatIfKnownVal1} onChange={(e) => setWhatIfKnownVal1(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-white font-mono focus:outline-none focus:border-white/40" placeholder="0" />
                          </div>
                          <div>
                            <label className="text-[10px] text-white/40 block mb-1.5 truncate">{whatIfResult.inputLabel2}</label>
                            <input type="number" value={whatIfKnownVal2} onChange={(e) => setWhatIfKnownVal2(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-white font-mono focus:outline-none focus:border-white/40" placeholder="0" />
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Result Output */}
                    <div className="flex flex-col justify-center">
                      {whatIfResult.isAlreadySecured ? (
                        <div className="h-full flex flex-col items-center justify-center p-8 bg-green-500/10 border border-green-500/20 rounded-3xl text-center">
                           <div className="w-16 h-16 rounded-full bg-green-500/20 flex items-center justify-center mb-6">
                             <Icons.Check className="w-8 h-8 text-green-400" />
                           </div>
                           <h3 className="text-2xl font-bold text-white mb-2">Target Secured</h3>
                           <p className="text-white/60 text-sm max-w-xs">Your entered marks already mathematically guarantee a Grade {whatIfGrade}.</p>
                        </div>
                      ) : !whatIfResult.isPossible ? (
                        <div className="h-full flex flex-col items-center justify-center p-8 bg-red-500/10 border border-red-500/20 rounded-3xl text-center">
                           <div className="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mb-6">
                             <Icons.AlertCircle className="w-8 h-8 text-red-400" />
                           </div>
                           <h3 className="text-2xl font-bold text-white mb-2">Mathematically Impossible</h3>
                           <p className="text-white/60 text-sm max-w-xs">You need {whatIfResult.neededRaw} marks, which exceeds the paper's maximum of {whatIfResult.maxAllowedRaw}.</p>
                        </div>
                      ) : (
                        <div className="h-full flex flex-col p-8 glass-panel border-white/20 rounded-3xl relative overflow-hidden">
                          <div className="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent pointer-events-none"></div>
                          
                          <div className="flex-1 flex flex-col items-center justify-center text-center z-10">
                            <span className="text-sm font-bold text-white/50 uppercase tracking-widest mb-4">Required Raw Mark</span>
                            <div className="flex items-baseline justify-center gap-2 mb-4">
                              <span className="text-8xl font-extrabold font-mono tracking-tighter text-white">{whatIfResult.neededRaw}</span>
                              <span className="text-2xl font-bold text-white/30">/{whatIfResult.maxAllowedRaw}</span>
                            </div>
                            <p className="text-sm font-medium text-white/70 max-w-xs">Score required on <span className="text-white">{whatIfResult.solvedPaperName}</span> to cross the {whatIfResult.targetWeightedScore}-mark threshold.</p>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'thresholds' && (
              <div className="animate-slide-up" style={{animationDelay: '0.1s'}}>
                <div className="glass-panel rounded-3xl p-8 relative overflow-hidden">
                  <div className="mb-10">
                    <h2 className="text-2xl font-extrabold text-white tracking-tight">System Threshold Editor</h2>
                    <p className="text-sm text-white/50 mt-2">Adjust raw weighted boundary limits to simulate custom curves.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {['physics', 'chemistry', 'biology'].map((subject) => {
                       const themeBorder = subject === 'physics' ? 'border-physics/30' : subject === 'chemistry' ? 'border-chemistry/30' : 'border-biology/30';
                       const themeBg = subject === 'physics' ? 'bg-physics' : subject === 'chemistry' ? 'bg-chemistry' : 'bg-biology';
                       
                       return (
                        <div key={subject} className={`bg-black/20 border ${themeBorder} rounded-2xl p-6`}>
                          <div className="flex items-center gap-3 mb-6">
                            <span className={`w-3 h-3 rounded-full ${themeBg}`}></span>
                            <h4 className="text-sm font-bold capitalize text-white tracking-wide">{subject}</h4>
                          </div>

                          <div className="space-y-3">
                            {['A', 'B', 'C', 'D', 'E'].map((letter) => (
                              <div key={letter} className="flex items-center justify-between p-2 rounded-xl hover:bg-white/5 transition-colors">
                                <span className="text-white/60 font-bold w-6"> {letter} </span>
                                <input
                                  type="number"
                                  value={customThresholds[subject][letter]}
                                  onChange={(e) => {
                                    const val = e.target.value; 
                                    setCustomThresholds(prev => ({
                                      ...prev, [subject]: { ...prev[subject], [letter]: val }
                                    }));
                                  }}
                                  className="bg-black/40 border border-white/10 rounded-lg py-1.5 px-3 w-20 text-center text-white font-mono font-bold focus:outline-none focus:border-white/50 transition-colors"
                                />
                              </div>
                            ))}
                          </div>
                        </div>
                      )
                    })}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
